# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8426
name: Floodlight Camera E30
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8426
  - T8426121
device_type: 87
capabilities:
  controls:
    manual_floodlight:
      connections:
        direct:
          status: declared
          notes: Implemented as an opt-in Home Assistant Manual floodlight for exact T8426 type 87 on channel zero with the current owner account. Requires independent manual-setting readback and sends once. It reports the manual override, not physical illumination or motion-lighting state. Hardware behaviour is unconfirmed. T8426121 and attached routes are excluded. No automatic-off timer is promised.
      read:
        parameter: 1400
      write:
        command: 1700
      values:
        "0": Manual override off
        "1": Manual override on
    enabled:
      connections:
        direct:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
  media:
    live_view:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-26
          tested_by: kingrun
          notes: Direct live video is visible after the v0.1.103 media-boundary fix, with continuous source and viewer delivery across the reported two-minute session.
    snapshot:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-26
          tested_by: kingrun
          notes: On-demand capture refreshes the image and its displayed timestamp after the v0.1.103 media-boundary fix.
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
    sound:
      connections:
        direct:
          status: declared
