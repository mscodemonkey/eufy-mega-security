        T8010:
          status: reported
          tested_on: 2026-10-08
          tested_by: erikas-venckus
          notes: Inventory reports the value, but its accuracy is not yet confirmed.
      read:
        parameter: 2111
    battery_health:
      connections:
        T8010:
          status: reported
          tested_on: 2026-10-08
          tested_by: erikas-venckus
          notes: Inventory reports the value, but its accuracy is not yet confirmed.
      read:
        parameter: 1198
