# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8111
name: eufyCam (original)
category: camera
integration:
  status: ready_to_test
  handler: camera
models:
  - T8111
device_type: 1
capabilities:
  readable:
    battery_level:
      connections:
        T8010:
          status: declared
        T8030:
          status: reported
          tested_on: 2026-09-30
          tested_by: bushbrother
      read:
        parameter: 1101
    battery_charging:
      connections:
        T8010:
          status: declared
        T8030:
          status: reported
          tested_on: 2026-09-30
          tested_by: bushbrother
      read:
        parameter: 2111
    battery_temperature:
      connections:
        T8010:
          status: declared
        T8030:
          status: reported
          tested_on: 2026-09-30
          tested_by: bushbrother
      read:
        parameter: 1138
    last_charging_days:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 99904
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T8010:
          status: declared
        T8030:
          status: reported
          tested_on: 2026-09-30
          tested_by: bushbrother
          notes: The HomeBase route is ready, but working live video is not confirmed.
    snapshot:
      connections:
        T8010:
          status: declared
        T8030:
          status: reported
          tested_on: 2026-09-30
          tested_by: bushbrother
          notes: The HomeBase route is ready, but a fresh snapshot is not confirmed.
  events:
    motion:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
    person:
