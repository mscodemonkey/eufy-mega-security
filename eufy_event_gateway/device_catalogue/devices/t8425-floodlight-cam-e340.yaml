# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8425
name: Floodlight Cam E340
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8425
  - T8425121
device_type: 47
notes: The contributor physically confirmed manual floodlight on and off on exact standalone T8425 firmware 1.6.4.6. The momentary command has no independent light-state readback or automatic-off guarantee. An opt-in brightness number is implemented for exact standalone T8425 with an owner account and independent readback. Physical brightness behaviour is unconfirmed. Master spotlight settings, T8425121 and attached routes are not covered.
capabilities:
  controls:
    motion_detection:
      connections:
        direct:
          status: declared
          notes: Implemented behind experimental model controls for exact T8425 type 47 on channel zero with the current owner account. A unique native baseline and independent readback are required. One absolute command is sent. Physical detection behaviour is unconfirmed. Model aliases and attached routes are excluded.
      read:
        parameter: 6040
      write:
        command: 1700
      values:
        "0": Detection off
        "1": Detection on
    motion_sensitivity:
      connections:
        direct:
          status: declared
          notes: Opt-in exact standalone T8425 only. Native steps 1 to 5 are offered only with a readable value and current owner account. Single write and fresh readback are required. Physical sensitivity behaviour is unconfirmed.
      read:
        parameter: 6041
      write:
        command: 1700
        input:
          name: sensitivity_step
          type: integer
          minimum: 1
          maximum: 5
    light_brightness:
      connections:
        direct:
          status: declared
          notes: Implemented behind experimental model controls for exact T8425 type 47 on channel zero with the current owner account and a readable baseline. Each request sends once and requires independent readback. Physical behaviour remains unconfirmed. T8425121 and attached routes are excluded.
      read:
        parameter: 1401
      write:
        command: 1401
        input:
          name: brightness_percent
          type: integer
          minimum: 1
          maximum: 100
    enabled:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    night_vision:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-22
          tested_by: cbource
          notes: The contributor physically confirmed Off, Infrared, and Spotlight on exact standalone T8425 firmware 1.6.4.6. This does not cover T8425121 or an attached route.
        T9000:
          status: declared
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        "0": "Off"
        "1": "Infrared"
        "2": "Spotlight"
    siren:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-22
          tested_by: cbource
          notes: The contributor physically confirmed start and stop on exact standalone T8425 firmware 1.6.4.6. Timed expiry and independent alarm state were not verified. This does not cover T8425121 or an attached route.
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        direct:
          status: mixed
          tested_on: 2026-10-21
          tested_by: cbource
          notes: cbource reports standalone direct firmware 1.6.4.6 on v0.1.192 starts in about one second and revisits cleanly. jsole510 reported intermittent revisit freezes on v0.1.103 on 2026-09-26; that setup has not been retested. These results do not confirm other controls or the T9000 route.
        T9000:
          status: failing
          tested_on: 2026-09-17
          tested_by: geroh20-source
          notes: The T9000 camera route cannot complete peer lookup.
    snapshot:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-26
          tested_by: jsole510
          notes: Fresh Home Assistant snapshot capture succeeds on v0.1.103.
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
  events:
    motion:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: frcbn
        T9000:
          status: declared
    person:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: frcbn
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
    pet:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
    sound:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
ignored:
  battery_sentinel:
    fields:
      - battery_level
      - battery_charging
      - battery_temperature
      - last_charging_days
    reason: This mains-powered model reports battery-shaped sentinel values.
