# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8425
name: Floodlight Cam E340
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8425
  - T8425121
device_type: 47
notes: The contributor physically confirmed manual floodlight on and off on exact standalone T8425 firmware 1.6.4.6. The momentary command has no independent light-state readback or automatic-off guarantee. Brightness, master spotlight settings, T8425121 and attached routes are not covered.
capabilities:
  controls:
    enabled:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    night_vision:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-22
          tested_by: cbource
          notes: The contributor physically confirmed Off, Infrared, and Spotlight on exact standalone T8425 firmware 1.6.4.6. This does not cover T8425121 or an attached route.
        T9000:
          status: declared
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        "0": "Off"
        "1": "Infrared"
        "2": "Spotlight"
    siren:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-22
          tested_by: cbource
          notes: The contributor physically confirmed start and stop on exact standalone T8425 firmware 1.6.4.6. Timed expiry and independent alarm state were not verified. This does not cover T8425121 or an attached route.
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        direct:
          status: mixed
          tested_on: 2026-10-21
          tested_by: cbource
          notes: cbource reports standalone direct firmware 1.6.4.6 on v0.1.192 starts in about one second and revisits cleanly. jsole510 reported intermittent revisit freezes on v0.1.103 on 2026-09-26; that setup has not been retested. These results do not confirm other controls or the T9000 route.
        T9000:
          status: failing
          tested_on: 2026-09-17
          tested_by: geroh20-source
          notes: The T9000 camera route cannot complete peer lookup.
    snapshot:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-26
          tested_by: jsole510
          notes: Fresh Home Assistant snapshot capture succeeds on v0.1.103.
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
  events:
    motion:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: frcbn
        T9000:
          status: declared
    person:
      connections:
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: frcbn
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
    pet:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
        T9000:
          status: reported
          tested_on: 2026-09-16
          tested_by: geroh20-source
    sound:
      connections:
        direct:
          status: declared
        T9000:
          status: declared
ignored:
  battery_sentinel:
    fields:
      - battery_level
      - battery_charging
      - battery_temperature
      - last_charging_days
    reason: This mains-powered model reports battery-shaped sentinel values.
