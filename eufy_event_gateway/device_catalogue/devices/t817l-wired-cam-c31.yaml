# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t817l
name: Wired Cam C31
category: camera
integration:
  status: supported
  handler: camera
models:
  - T817L
  - T817L121
device_type: 10031
capabilities:
  readable:
    last_recognized_person:
      connections:
        T8030:
          status: unknown
          notes: The integration exposes the sensor, but model-specific recognition has not been confirmed.
      read:
        field: last_recognized_person
  controls:
    enabled:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-20
          tested_by: mscodemonkey
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    privacy_mode:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-20
          tested_by: mscodemonkey
      requires_parameter: 6250
      write:
        command: 6250
      values:
        "0": "Off"
        "1": "On"
      notes: Write-only control with no reliable state readback.
    preset_positions:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-09
          tested_by: mscodemonkey
          notes: Exact T817L type 10031 firmware 2.1.0.3. Three saved targets and default return passed through Home Assistant with and without a separate viewer. Movement retains decoded source ownership until travel completes.
        T8030:
          status: tested
          tested_on: 2026-09-28
          tested_by: mscodemonkey
      read:
        parameter: 6034
      write:
        command: 6035
        input:
          name: preset_index
          type: integer
          minimum: 0
          maximum: 9
      notes: The camera reports enabled slots and its default. Movement is applied without a readable command acknowledgement.
    light:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-09
          tested_by: mscodemonkey
          notes: Exact T817L type 10031 firmware 2.1.0.3. Authenticated native manual commands and fresh gateway images confirm on and off. Stateless actions preserve the existing motion-light policy. No automatic timeout is claimed.
      write:
        command: 1400
    ai_tracking:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-28
          tested_by: mscodemonkey
      read:
        field: ai_tracking_status
      write:
        command: 6016
      values:
        "0": "Off"
        "1": "On"
      notes: The official app and local hardware confirm the action. The local route exposes separate actions because equivalent persistent readback is unavailable.
    automatic_cruise:
      connections:
        direct:
          status: tested
          tested_on: 2026-10-09
          tested_by: mscodemonkey
          notes: Exact T817L type 10031 firmware 2.1.0.3. Gateway and actual Home Assistant actions stop and restart cycling through existing app schedules, with and without a separate viewer. No persistent cruise state or schedule editing is exposed.
        T8030:
          status: tested
          tested_on: 2026-09-28
          tested_by: mscodemonkey
      read:
        field: video_auto_cruise_switch
      write:
        command: 6031
      values:
        "0": "Off"
        "1": "On"
      notes: The official app and local hardware confirm the action. The local route exposes separate actions because equivalent persistent readback is unavailable.
    motion_detection:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    night_vision:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        "0": "PureColor"
        "1": "Infrared"
        "2": "Spotlight"
    siren:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
        direct:
          status: declared
    snapshot:
      connections:
        T8030:
          status: tested
          tested_on: 2026-09-21
          tested_by: mscodemonkey
        direct:
          status: declared
  events:
    motion:
      connections:
        T8030:
          status: declared
          tested_on: 2026-09-21
          tested_by: mscodemonkey
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: monkey-80
    person:
      connections:
        T8030:
          status: declared
        direct:
          status: tested
          tested_on: 2026-09-24
          tested_by: monkey-80
    stranger:
      connections:
        T8030:
          status: unknown
    pet:
      connections:
        T8030:
          status: declared
    vehicle:
      connections:
        T8030:
          status: declared
    dog:
      connections:
        T8030:
          status: unknown
    crying:
      connections:
        T8030:
          status: declared
    sound:
      connections:
        T8030:
          status: declared
    package_stranded:
      connections:
        T8030:
          status: unknown
          notes: The integration exposes this generic sensor, but the device record does not declare it.
ignored:
  battery:
    fields:
      - battery.level
      - battery.charging
      - battery.health
      - battery.temperature
    reason: Mains-powered device reports compatibility placeholder values.
