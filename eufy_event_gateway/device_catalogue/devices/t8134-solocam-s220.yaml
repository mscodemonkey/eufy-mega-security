  controls:
    motion_sensitivity:
      connections:
        direct:
          status: declared
          notes: Opt-in exact T8134 type 63 standalone seven-step candidate. Requires owner authentication, a fresh native baseline and independent matching readback. Physical sensitivity behaviour remains unconfirmed.
      read:
        parameter: 6070
      write:
        command: 1700
        input:
          name: sensitivity_step
          type: integer
          minimum: 1
          maximum: 7
    enabled:
      connections:
        direct:
          status: reported
          tested_on: 2026-11-05
          tested_by: luxt12
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
  media:
    live_view:
      connections:
        direct:
          status: reported
          tested_on: 2026-11-05
          tested_by: luxt12
          notes: Default compatible H.264 starts in approximately 1 to 3 seconds and plays stably. Native mode without faster startup takes over 30 seconds and initially freezes. Receive audio was unavailable in that test. A later v0.1.248 diagnostic counted clear AAC. The exact type-63 direct-route candidate uses the default-off Live audio switch. Audible playback remains unconfirmed.
        T8030:
          status: reported
          tested_on: 2026-09-16
          tested_by: bh5wq98d8w-ctrl
    snapshot:
      connections:
        direct:
          status: reported
          tested_on: 2026-11-05
          tested_by: luxt12
          notes: Capture Fresh Snapshot is confirmed on two standalone Wi-Fi cameras with firmware 3.3.6.0. This is separate from the stale event picture.
    record_clip:
      connections:
        direct:
          status: reported
          tested_on: 2026-11-05
          tested_by: luxt12
          notes: Gateway MP4 recording succeeds at 960x540 and 2304x1296 according to the selected quality. The files contain video only.
