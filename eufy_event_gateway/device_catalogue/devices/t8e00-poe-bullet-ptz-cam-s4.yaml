# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8e00
name: PoE Bullet-PTZ Cam S4
category: camera
integration:
  status: recognised
models:
  - T8E00
  - T8E00121
device_type: 301
capabilities:
  controls:
    pan_tilt:
      connections:
        T9000:
          status: declared
          notes: Default-off exact T8E00 type 301 through T9000 type 27 movement candidate. Single direction clicks require a current owner-bound live viewer on the Movable source. Physical movement is unconfirmed. Zoom, night vision, quality and view selection remain excluded on this route.
      write:
        command: 6030
    enabled:
      connections:
        T9000:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    night_vision:
      connections:
        T9000:
          status: declared
        T8N00:
          status: declared
          notes: Experimental T8N00 only. Exact T8E00/type301. NVR values 0 Standard, 1
            Infrared, 2 Spotlight. Default-off and hardware-unconfirmed.
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        "0": "Off"
        "1": "Infrared"
        "2": "Spotlight"
    siren:
      connections:
        T9000:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T9000:
          status: declared
          notes: Normal HA live view is implemented behind the default-off NVR video option for exact T8E00/type 301 through T9000/type 27. A reporter confirmed normal HA live view using the PTZ lens on v0.1.243 in issue 308. Sustained playback, fresh reopening and fixed-lens selection remain unconfirmed. That release added no camera controls.
        T8N00:
          status: declared
          notes: Experimental opt-in normal playback. Source profile and selected lens
            require hardware confirmation.
    snapshot:
      connections:
        T9000:
          status: declared
  events:
    motion:
      connections:
        T9000:
          status: declared
    person:
      connections:
        T9000:
          status: declared
    pet:
      connections:
        T9000:
          status: declared
    vehicle:
      connections:
        T9000:
          status: declared
    sound:
      connections:
        T9000:
          status: declared
