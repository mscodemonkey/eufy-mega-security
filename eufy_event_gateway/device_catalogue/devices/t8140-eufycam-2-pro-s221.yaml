# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8140
name: eufyCam 2 Pro (S221)
category: camera
integration:
  status: ready_to_test
  handler: camera
models:
  - T8140
  - T8140R
  - T8140-R
device_type: 14
capabilities:
  readable:
    battery_level:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1101
    battery_charging:
      connections:
        T8010:
          status: declared
      read:
        parameter: 2111
    battery_temperature:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1138
    last_charging_days:
      connections:
        T8010:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        T8010:
          status: declared
      read:
        parameter: 99904
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        T8010:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-21
          tested_by: PerssonNiklas
    snapshot:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-21
          tested_by: PerssonNiklas
  events:
    motion:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-23
          tested_by: PerssonNiklas
    person:
      connections:
        T8010:
          status: failing
          tested_on: 2026-09-23
          tested_by: PerssonNiklas
          notes: The Eufy app labels the event as a person, but the gateway notification carries only generic motion evidence.
    pet:
      connections:
        T8010:
          status: declared
    vehicle:
      connections:
        T8010:
          status: declared
    sound:
      connections:
        T8010:
          status: declared
