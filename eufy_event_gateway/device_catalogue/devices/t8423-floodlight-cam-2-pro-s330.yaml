# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8423
name: Floodlight Cam 2 Pro (S330)
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8423
device_type: 38
capabilities:
  controls:
    enabled:
      connections:
        direct:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 6040
      write:
        action: unavailable_until_direct_motion_control_is_verified
      values:
        "0": "Off"
        "1": "On"
      notes: Exact T8423 standalone state uses 6040. Attached state retains 1011. Reading the state does not enable a motion control or establish physical detection.
    spotlight_master:
      connections:
        direct:
          status: declared
      read:
        parameter: 1403
      write:
        action: unavailable_until_spotlight_control_is_verified
      values:
        "0": "Off"
        "1": "On"
      notes: Exact T8423 reports the master spotlight setting separately from the momentary manual light. This is reported state only, not a new light control or proof that the light is illuminated.
  media:
    live_view:
      connections:
        direct:
          status: mixed
          tested_on: 2026-09-30
          tested_by: Volker88
          notes: v0.1.108 starts stable H.265 video in most attempts, but some attempts still need the viewer reopened and CPU recovery after closing remains under review.
        T8030:
          status: declared
    snapshot:
      connections:
        direct:
          status: failing
          tested_on: 2026-09-20
          tested_by: Volker88
          notes: Fresh capture leaves the previous retained image in place.
        T8030:
          status: declared
