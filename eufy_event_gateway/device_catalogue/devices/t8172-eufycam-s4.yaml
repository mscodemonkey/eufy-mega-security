# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8172
name: eufyCam S4
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8172
  - T81721W1
device_type: 89
notes: HomeBase 3 hardware confirms discovery, media, and core detections for type 89.
capabilities:
  readable:
    battery_level:
      connections:
        direct:
          status: declared
      read:
        parameter: 1101
    battery_charging:
      connections:
        direct:
          status: declared
      read:
        parameter: 2111
    battery_temperature:
      connections:
        direct:
          status: declared
      read:
        parameter: 1138
    last_charging_days:
      connections:
        direct:
          status: declared
      read:
        field: charging_days
  controls:
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        direct:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        direct:
          status: declared
        T8030:
          status: tested
          tested_on: 2026-10-01
          tested_by: RickyN29
        T9000:
          status: failing
          tested_on: 2026-10-01
          tested_by: basiokan
          notes: Child-camera peer lookup times out before media starts.
    snapshot:
      connections:
        direct:
          status: declared
        T8030:
          status: tested
          tested_on: 2026-10-01
          tested_by: RickyN29
        T9000:
          status: failing
          tested_on: 2026-10-01
          tested_by: basiokan
          notes: Fresh capture stops at the shared station peer lookup.
  events:
    motion:
      connections:
        direct:
          status: declared
        T8030:
          status: tested
          tested_on: 2026-10-01
          tested_by: RickyN29
    person:
      connections:
        direct:
          status: declared
        T8030:
          status: tested
          tested_on: 2026-10-01
          tested_by: RickyN29
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
        T8030:
          status: tested
          tested_on: 2026-10-01
          tested_by: RickyN29
    sound:
      connections:
        direct:
          status: declared
