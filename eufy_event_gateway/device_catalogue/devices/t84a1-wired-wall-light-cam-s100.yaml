# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t84a1
name: Wired Wall Light Cam S100
category: camera
integration:
  status: supported
  handler: camera
models:
  - T84A1
  - T84A1311
device_type: 151
capabilities:
  controls:
    enabled:
      connections:
        direct:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        direct:
          status: failing
          tested_on: 2026-09-28
          tested_by: philippk75
          notes: The attached-camera duration command produced no physical start or stop action over the direct route.
      write:
        action: unavailable_until_direct_command_is_proven
      notes: Direct siren control remains unexposed until its separate command contract is identified.
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 6040
      write:
        action: unavailable_until_direct_motion_control_is_verified
      values:
        "0": "Off"
        "1": "On"
      notes: Exact T84A1 standalone state uses 6040. Attached state retains 1011. Reading the state does not enable a motion control or establish physical detection.
    spotlight_master:
      connections:
        direct:
          status: declared
      read:
        parameter: 1403
      write:
        action: unavailable_until_spotlight_control_is_verified
      values:
        "0": "Off"
        "1": "On"
      notes: Exact T84A1 reports the master spotlight setting separately from the momentary manual light. This is reported state only, not a new light control or proof that the light is illuminated.
  media:
    live_view:
      connections:
        direct:
          status: mixed
          tested_on: 2026-09-24
          notes: Codec setup and playback start across reported setups, but one remains choppy and can freeze during stream recycling.
    snapshot:
      connections:
        direct:
          status: mixed
          tested_on: 2026-09-20
          notes: Fresh capture results differ between reported setups.
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
    sound:
      connections:
        direct:
          status: declared
