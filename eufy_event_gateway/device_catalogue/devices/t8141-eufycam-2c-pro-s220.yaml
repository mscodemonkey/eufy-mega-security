# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8141
name: eufyCam 2C Pro (S220)
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8141
  - T8142
  - T8142-Z
device_type: 15
capabilities:
  readable:
    battery_level:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1101
    battery_charging:
      connections:
        T8010:
          status: declared
      read:
        parameter: 2111
    battery_temperature:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1138
    last_charging_days:
      connections:
        T8010:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        T8010:
          status: declared
      read:
        parameter: 99904
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    night_vision:
      connections:
        T8010:
          status: declared
      read:
        parameter: 1277
      write:
        command: 1277
      values:
        "0": "Off"
        "1": "Infrared"
        "2": "Spotlight"
    siren:
      connections:
        T8010:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-18
          tested_by: guidog66
    snapshot:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-18
          tested_by: guidog66
  events:
    motion:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-24
          tested_by: guidog66
    person:
      connections:
        T8010:
          status: declared
    pet:
      connections:
        T8010:
          status: declared
    vehicle:
      connections:
        T8010:
          status: declared
    sound:
      connections:
        T8010:
          status: declared
