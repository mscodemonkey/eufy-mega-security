schema: 1
id: t8144
name: eufyCam E40
category: camera
integration:
  status: ready_to_test
  handler: camera
models:
  - T8144
device_type: 49
capabilities:
  readable:
    battery_level:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 1101
    battery_charging:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 2111
    battery_temperature:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 1138
    last_charging_days:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 99904
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        T8010:
          status: mixed
          tested_on: 2026-09-22
          tested_by: philMo2305
          notes: Chrome produced a picture for 7 to 10 seconds, while Safari remained blank and the stream did not stay live.
        T8030:
          status: declared
    snapshot:
      connections:
        T8010:
          status: mixed
          tested_on: 2026-09-22
          tested_by: philMo2305
          notes: Fresh images work, but intermittent FFmpeg reference-frame errors still appear on the snapshot path.
        T8030:
          status: declared
  events:
    motion:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-20
          tested_by: philMo2305
        T8030:
          status: declared
    person:
