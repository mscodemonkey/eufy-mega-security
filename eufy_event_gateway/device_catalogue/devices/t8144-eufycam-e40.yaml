        T8010:
          status: reported
          tested_on: 2026-09-20
          tested_by: philMo2305
        T8030:
          status: declared
    vehicle:
      connections:
        T8010:
          status: declared
        T8030:
          status: declared
    sound:
      connections:
        T8010:
          status: reported
          tested_on: 2026-09-20
          tested_by: philMo2305
        T8030:
          status: declared
