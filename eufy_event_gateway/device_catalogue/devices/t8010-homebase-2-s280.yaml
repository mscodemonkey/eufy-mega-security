# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8010
name: HomeBase 2 (S280)
category: homebase
integration:
  status: supported
  handler: homebase
aliases:
  - HomeBase 2
  - HomeBase S280
  - S280
models:
  - T8010
  - T80101D2
device_type: 0
notes: Protocol type 0 is shared with T8001 and T8002. Discovery and read-only SD storage are reported working, while station state and ordinary controls still need HomeBase 2 testing.
capabilities:
  readable:
    current_mode:
      connections:
        direct:
          status: unknown
      read:
        parameter: 1151
      values:
        "0": "Away"
        "1": "Home"
        "3": "Custom 1"
        "4": "Custom 2"
        "5": "Custom 3"
        "6": "Off"
        "63": "Disarmed"
    alarm_active:
      connections:
        direct:
          status: unknown
      read:
        field: alarm
    storage_status:
      connections:
        direct:
          status: reported
          tested_on: 2026-09-28
          tested_by: philMo2305
          notes: The raw status value 26 is preserved as unknown_26 until its meaning is established.
      read:
        parameter: 1135
    storage_capacity:
      connections:
        direct:
          status: reported
          tested_on: 2026-09-28
          tested_by: philMo2305
      read:
        field: sd_capacity
    storage_available:
      connections:
        direct:
          status: reported
          tested_on: 2026-09-28
          tested_by: philMo2305
      read:
        field: sd_capacity_available
  controls:
    guard_mode:
      connections:
        direct:
          status: unknown
      read:
        parameter: 1224
      write:
        command: 1224
      values:
        "0": "Away"
        "1": "Home"
        "2": "Schedule"
        "3": "Custom 1"
        "4": "Custom 2"
        "5": "Custom 3"
        "6": "Off"
        "47": "Geofencing"
        "63": "Disarmed"
      notes: The Off value is reported only when a keypad is attached.
    time_format:
      connections:
        direct:
          status: unknown
      read:
        parameter: 1253
      write:
        command: 1253
      values:
        "0": "12 hour"
        "1": "24 hour"
    alarm_tone:
      connections:
        direct:
          status: unknown
      read:
        parameter: 1281
      write:
        command: 1281
      values:
        "1": "Alarm sound 1"
        "2": "Alarm sound 2"
    siren:
      connections:
        direct:
          status: reported
          tested_on: 2026-09-21
      write:
        command: 1201
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren. Confirmed durations are 60, 300, 600, and 900 seconds.
