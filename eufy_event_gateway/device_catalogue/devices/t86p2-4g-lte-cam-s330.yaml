# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t86p2
name: 4G LTE Cam S330
category: camera
integration:
  status: ready_to_test
  handler: camera
models:
  - T86P2
  - T86P2121
device_type: 111
capabilities:
  readable:
    battery_level:
      connections:
        direct:
          status: declared
      read:
        parameter: 1101
    battery_charging:
      connections:
        direct:
          status: declared
      read:
        parameter: 2111
    battery_temperature:
      connections:
        direct:
          status: declared
      read:
        parameter: 1138
    last_charging_days:
      connections:
        direct:
          status: declared
      read:
        field: charging_days
  controls:
    enabled:
      connections:
        direct:
          status: declared
      read:
        parameter: 1035
      write:
        command: 1035
      values:
        "0": "Off"
        "1": "On"
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 1011
      write:
        command: 1011
      values:
        "0": "Off"
        "1": "On"
    siren:
      connections:
        direct:
          status: declared
      requires_parameter: 1015
      write:
        command: 1202
        input:
          name: duration_seconds
          type: integer
          minimum: 0
          maximum: 900
      notes: A duration of 0 stops the siren.
  media:
    live_view:
      connections:
        direct:
          status: declared
    snapshot:
      connections:
        direct:
          status: declared
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
    sound:
      connections:
        direct:
          status: declared
