# yaml-language-server: $schema=../device.schema.json

schema: 1
id: t8417
name: Indoor Cam E30
category: camera
integration:
  status: supported
  handler: camera
models:
  - T8417
  - T8417121
device_type: 105
capabilities:
  controls:
    privacy_mode:
      connections:
        direct:
          status: failing
          tested_on: 2026-09-28
          tested_by: nicofirst1
          notes: Parameter 6250 remained 0 with the physical lens both open and closed, so it is not a usable privacy-state readback.
      read:
        parameter: 6250
      write:
        command: 6250
      values:
        "0": "Unknown polarity"
        "1": "Unknown polarity"
      notes: Diagnostic only. The integration reports the raw value without exposing a control or claiming physical privacy state.
    motion_detection:
      connections:
        direct:
          status: declared
      read:
        parameter: 6040
      write:
        action: unavailable_until_direct_motion_control_is_verified
      notes: Exact T8417 standalone state uses 6040. Attached state retains 1011. Reading the state does not enable a motion control or establish physical detection.
      values:
        "0": "Off"
        "1": "On"
    spotlight_master:
      connections:
        direct:
          status: declared
      read:
        parameter: 1403
      write:
        action: unavailable_until_spotlight_control_is_verified
      values:
        "0": "Off"
        "1": "On"
      notes: Exact T8417 reports the master spotlight setting separately from the momentary manual light. This is reported state only, not a new light control or proof that the light is illuminated.
  media:
    live_view:
      connections:
        direct:
          status: declared
    snapshot:
      connections:
        direct:
          status: declared
  events:
    motion:
      connections:
        direct:
          status: declared
    person:
      connections:
        direct:
          status: declared
    pet:
      connections:
        direct:
          status: declared
    vehicle:
      connections:
        direct:
          status: declared
    sound:
      connections:
        direct:
          status: declared
