name: Eufy Mega Security
version: "0.1.148"
slug: eufy_event_gateway
description: Event-first Eufy camera bridge for Home Assistant
url: https://github.com/mscodemonkey/eufy-mega-security
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
ports:
  3218/tcp: null
ports_description:
  3218/tcp: Gateway API
watchdog: http://[HOST]:[PORT:3218]/live
ingress: true
ingress_port: 3218
panel_icon: mdi:cctv
host_network: true
hassio_api: true
discovery:
  - eufy_event_gateway
options:
  username: ""
  password: ""
  country: AU
  verification_code: ""
  capture_failed_event_images: false
  experimental_model_controls: false
  experimental_e30_locks: false
  experimental_nvr_live: false
  experimental_nvr_region: auto
  experimental_fixed_h265_resolution: false
schema:
  username: str
  password: password
  country: str
  verification_code: str
  capture_failed_event_images: bool
  experimental_model_controls: bool
  experimental_e30_locks: bool?
  experimental_nvr_live: bool
  experimental_nvr_region: list(auto|us|eu|ie)
  experimental_fixed_h265_resolution: bool?
