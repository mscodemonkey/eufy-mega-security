configuration:
  capture_failed_event_images:
    name: Capture failed event images
    description: Private diagnostic capture for 30 minutes after startup. Export within 60 minutes. May contain household images and identifiers. Disable after collecting evidence.
  username:
    name: Eufy username
    description: Dedicated guest Eufy account shared with the required cameras.
  password:
    name: Eufy password
    description: Password for the dedicated guest Eufy account.
  country:
    name: Country
    description: Two-letter country code for the Eufy account, such as AU.
  verification_code:
    name: Verification code
    description: Temporary email code requested by Eufy during first sign-in. Remove it after the app connects.
network:
  3218/tcp: Gateway API
