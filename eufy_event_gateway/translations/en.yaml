configuration:
  experimental_cloud_recordings:
    name: Experimental cloud recording test
    description: Request an existing private cloud recording in Diagnostics with explicit consent. Video only. Local HomeBase recordings and deletion are separate. Off by default.
  experimental_doorbell_rtc:
    name: Experimental standalone doorbell video test
    description: Enable a consented ten-second private video test in Diagnostics for a standalone Video Doorbell C30. Normal streaming stays unchanged. Hardware behaviour is unconfirmed. Off by default.
  experimental_general_rtc:
    name: Experimental general camera video test
    description: Enable a consented ten-second private video test in Diagnostics for a supported camera on the owner account. A guest account is refused. The Eufy live-view PIN you enter is sent to Eufy and is not stored. Excludes cameras on an NVR and the T8224 doorbell. Hardware behaviour is unconfirmed. Off by default.
  experimental_nvr_controls:
    name: Experimental NVR control tests
    description: Enable separately consented camera-power and Schedule-to-Home restoration tests for T8E00 through T8N00 in Diagnostics. Requires the other experimental options. A lost connection can require manual restoration. Off by default.
  experimental_nvr_live:
    name: Experimental NVR video test
    description: Enable a consented ten-second private video test in Diagnostics for T8E00 cameras through T8N00 or T9000. Hardware behaviour is unconfirmed. Off by default.
  experimental_nvr_region:
    name: Experimental video service region
    description: Select auto, us, eu or ie. GB-style accounts may require ie even when auto selects eu. This is a service region, not the account country.
  experimental_model_controls:
    name: Experimental model controls
    description: Enable exact-model control trials in the diagnostics page. Requires manual observation and restoration. Hardware support is unconfirmed. Off by default.
  capture_failed_event_images:
    name: Capture failed event images
    description: Private diagnostic capture for 30 minutes after startup. Export within 60 minutes. May contain household images and identifiers. Disable after collecting evidence.
  username:
    name: Eufy username
    description: Dedicated guest Eufy account shared with the required cameras.
  password:
    name: Eufy password
    description: Password for the dedicated guest Eufy account.
  country:
    name: Country
    description: Two-letter country code for the Eufy account, such as AU.
  verification_code:
    name: Verification code
    description: Temporary email code requested by Eufy during first sign-in. Remove it after the app connects.
network:
  3218/tcp: Gateway API
