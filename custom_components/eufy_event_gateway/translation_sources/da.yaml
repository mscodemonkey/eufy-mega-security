config:
  step:
    user:
      title: Forbind til Eufy Mega Security
      description: Indtast addressen Home Assistant bruger til at forbinde til lokal gateway.
      data:
        url: Gateway URL
        api_token: API nøgle
      data_description:
        url: Eksempel, http://192.168.1.20:3218
        api_token: Lad være tom hvis gateway er begrænset til samme vært.
    reconfigure:
      title: Genkonfigurer Eufy Mega Security
      description: Opdater addresse eller API nøgle til gateway.
      data:
        url: Gateway URL
        api_token: API nøgle
      data_description:
        url: For den lokale app, brug adressen leveret af Supervisor discovery. Manuelle installationer bruger normalt http://127.0.0.1:3218.
        api_token: Brug den samme nøgle som er konfigureteret i Eufy Mega Security appen.
    hassio_confirm:
      title: Forbind til Eufy Mega Security appen
      description: Home Assistant fandt den lokale Eufy Mega Security app. Tilføj for at oprette kamera og detektions entiteter.
