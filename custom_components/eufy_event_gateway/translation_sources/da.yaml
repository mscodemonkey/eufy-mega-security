    cannot_connect: Kunne ikke forbinde til gateway
    invalid_auth: Gatewayen afviste API nøglen
  abort:
    already_configured: Denne gateway er allerede konfigureret
    reconfigure_successful: Gateway forbindelsen er opdateret
    hassio_connected: Integrationen er nu forbundet med den lokale Eufy Mega Security app
    invalid_discovery: Appen leverede ugyldige forbindelses detaljer
